name: CleanerExtendedSEQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  ExtendedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: test.com.PhotoCleanerApp.ExtendedSEUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExtendedUITests:
    build:
      targets:
        ExtendedUITests: [test]
    test:
      targets: [ExtendedUITests]
