name: CleanerNativeQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  Cleaner:
    type: application
    platform: iOS
    sources:
      - path: ../../PhotoCleanerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: test.com.PhotoCleanerApp
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: Review selected media for cleanup.
        NSPhotoLibraryAddUsageDescription: Save your edited image to your photo library.
        NSContactsUsageDescription: Review and back up contacts.
        NSCalendarsFullAccessUsageDescription: Review calendar events.
  CleanerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FidelityRegressionTests.swift
      - path: cleaner-test-video.mp4
    dependencies:
      - target: Cleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: test.com.PhotoCleanerApp.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cleaner:
    build:
      targets:
        Cleaner: all
        CleanerUITests: [test]
    test:
      targets: [CleanerUITests]
